<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f4f1f8"/>

  <!-- Top bar -->
  <rect x="80" y="60" width="1040" height="56" rx="10" fill="#ffffff" opacity="0.9"/>
  <rect x="104" y="78" width="120" height="20" rx="4" fill="#7611a6" opacity="0.15"/>
  <rect x="240" y="82" width="80" height="12" rx="3" fill="#ccc"/>
  <rect x="336" y="82" width="80" height="12" rx="3" fill="#ccc"/>
  <circle cx="1080" cy="88" r="16" fill="#7611a6" opacity="0.2"/>
  <circle cx="1040" cy="88" r="16" fill="#eee"/>

  <!-- Step indicator -->
  <rect x="80" y="148" width="1040" height="48" rx="8" fill="#fff" opacity="0.7"/>
  <!-- Step 1 active -->
  <circle cx="160" cy="172" r="14" fill="#7611a6"/>
  <text x="160" y="177" text-anchor="middle" fill="white" font-size="13" font-family="sans-serif" font-weight="700">1</text>
  <text x="182" y="177" fill="#7611a6" font-size="11" font-family="sans-serif">Buscar producto</text>
  <!-- Step 2 -->
  <circle cx="340" cy="172" r="14" fill="#e8d5f5"/>
  <text x="340" y="177" text-anchor="middle" fill="#7611a6" font-size="13" font-family="sans-serif" font-weight="700">2</text>
  <text x="362" y="177" fill="#aaa" font-size="11" font-family="sans-serif">Seleccionar oferta</text>
  <!-- Step 3 -->
  <circle cx="530" cy="172" r="14" fill="#e8e8e8"/>
  <text x="530" y="177" text-anchor="middle" fill="#999" font-size="13" font-family="sans-serif" font-weight="700">3</text>
  <text x="552" y="177" fill="#bbb" font-size="11" font-family="sans-serif">Confirmar orden</text>

  <!-- Main card left -->
  <rect x="80" y="224" width="580" height="440" rx="12" fill="#ffffff" opacity="0.95"/>

  <!-- Search bar inside card -->
  <rect x="108" y="256" width="524" height="44" rx="8" fill="#f7f4fc"/>
  <rect x="124" y="270" width="180" height="14" rx="3" fill="#d8c8f0"/>
  <rect x="596" y="268" width="24" height="18" rx="4" fill="#7611a6" opacity="0.5"/>

  <!-- Product list items -->
  <rect x="108" y="320" width="524" height="68" rx="8" fill="#f9f9f9"/>
  <rect x="124" y="336" width="200" height="13" rx="3" fill="#333" opacity="0.7"/>
  <rect x="124" y="357" width="140" height="10" rx="3" fill="#bbb"/>
  <rect x="548" y="330" width="72" height="28" rx="6" fill="#7611a6"/>
  <text x="584" y="349" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="600">Agregar</text>

  <rect x="108" y="400" width="524" height="68" rx="8" fill="#f0eafa"/>
  <rect x="124" y="416" width="220" height="13" rx="3" fill="#7611a6" opacity="0.6"/>
  <rect x="124" y="437" width="160" height="10" rx="3" fill="#b89fd4"/>
  <rect x="548" y="410" width="72" height="28" rx="6" fill="#7611a6"/>
  <text x="584" y="429" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="600">Agregar</text>
  <!-- Selected indicator -->
  <rect x="108" y="400" width="5" height="68" rx="2" fill="#7611a6"/>

  <rect x="108" y="480" width="524" height="68" rx="8" fill="#f9f9f9"/>
  <rect x="124" y="496" width="190" height="13" rx="3" fill="#333" opacity="0.7"/>
  <rect x="124" y="517" width="120" height="10" rx="3" fill="#bbb"/>
  <rect x="548" y="490" width="72" height="28" rx="6" fill="#7611a6"/>
  <text x="584" y="509" text-anchor="middle" fill="white" font-size="11" font-family="sans-serif" font-weight="600">Agregar</text>

  <!-- Pagination dots -->
  <circle cx="320" cy="600" r="5" fill="#7611a6"/>
  <circle cx="336" cy="600" r="5" fill="#ddd"/>
  <circle cx="352" cy="600" r="5" fill="#ddd"/>

  <!-- Right panel - order summary -->
  <rect x="688" y="224" width="432" height="440" rx="12" fill="#a05cc4"/>

  <!-- Right panel content -->
  <text x="832" y="278" text-anchor="middle" fill="white" font-size="16" font-family="sans-serif" font-weight="600" opacity="0.9">Resumen de compra</text>
  <rect x="712" y="294" width="384" height="1" fill="white" opacity="0.2"/>

  <!-- Order items -->
  <rect x="712" y="314" width="240" height="12" rx="3" fill="white" opacity="0.5"/>
  <rect x="984" y="314" width="80" height="12" rx="3" fill="white" opacity="0.7"/>

  <rect x="712" y="340" width="200" height="12" rx="3" fill="white" opacity="0.5"/>
  <rect x="984" y="340" width="80" height="12" rx="3" fill="white" opacity="0.7"/>

  <rect x="712" y="366" width="220" height="12" rx="3" fill="white" opacity="0.5"/>
  <rect x="984" y="366" width="80" height="12" rx="3" fill="white" opacity="0.7"/>

  <rect x="712" y="394" width="352" height="1" fill="white" opacity="0.15"/>

  <!-- Selected item highlighted -->
  <rect x="712" y="410" width="352" height="52" rx="8" fill="white" opacity="0.12"/>
  <rect x="724" y="422" width="180" height="12" rx="3" fill="white" opacity="0.8"/>
  <rect x="724" y="440" width="120" height="10" rx="3" fill="white" opacity="0.4"/>
  <rect x="1000" y="420" width="52" height="12" rx="3" fill="white" opacity="0.9"/>

  <!-- Total -->
  <rect x="712" y="480" width="352" height="1" fill="white" opacity="0.2"/>
  <text x="724" y="506" fill="white" font-size="13" font-family="sans-serif" opacity="0.7">Total estimado</text>
  <text x="1064" y="506" text-anchor="end" fill="white" font-size="18" font-family="sans-serif" font-weight="700">$439.000</text>

  <!-- Supplier count badge -->
  <rect x="712" y="524" width="352" height="44" rx="8" fill="white" opacity="0.1"/>
  <circle cx="736" cy="546" r="10" fill="white" opacity="0.3"/>
  <text x="736" y="550" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif" font-weight="700">3</text>
  <text x="756" y="550" fill="white" font-size="12" font-family="sans-serif" opacity="0.8">proveedores disponibles</text>

  <!-- CTA button -->
  <rect x="712" y="592" width="352" height="48" rx="10" fill="white" opacity="0.95"/>
  <text x="888" y="621" text-anchor="middle" fill="#a05cc4" font-size="14" font-family="sans-serif" font-weight="700">Generar orden de compra →</text>

  <!-- Bottom stat bar -->
  <rect x="80" y="688" width="1040" height="60" rx="10" fill="#fff" opacity="0.6"/>
  <text x="200" y="718" text-anchor="middle" fill="#7611a6" font-size="20" font-family="sans-serif" font-weight="700">+600K</text>
  <text x="200" y="736" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">órdenes procesadas</text>
  <rect x="340" y="698" width="1" height="40" fill="#e0e0e0"/>
  <text x="480" y="718" text-anchor="middle" fill="#7611a6" font-size="20" font-family="sans-serif" font-weight="700">US$439M</text>
  <text x="480" y="736" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">transaccionados</text>
  <rect x="620" y="698" width="1" height="40" fill="#e0e0e0"/>
  <text x="760" y="718" text-anchor="middle" fill="#7611a6" font-size="20" font-family="sans-serif" font-weight="700">4.5x</text>
  <text x="760" y="736" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">más cotizaciones por licitación</text>
  <rect x="900" y="698" width="1" height="40" fill="#e0e0e0"/>
  <text x="1030" y="718" text-anchor="middle" fill="#7611a6" font-size="20" font-family="sans-serif" font-weight="700">80%</text>
  <text x="1030" y="736" text-anchor="middle" fill="#888" font-size="11" font-family="sans-serif">PyMEs</text>
</svg>
